<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shellbox</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="light">
  <div id="app">
    <!-- top bar: vault and SFTP tabs, terminal tabs, new tab, settings and window buttons -->
    <header id="titlebar" data-tauri-drag-region>
      <button class="tb-menu" id="btn-menu" title="Menu"></button>
      <div id="tabs" data-tauri-drag-region></div>
      <div class="titlebar-right" data-tauri-drag-region>
        <button class="tb-icon" id="btn-bell" title="Notifications"></button>
        <div class="win-controls">
          <button class="win-btn" id="win-min" title="Minimize"></button>
          <button class="win-btn" id="win-max" title="Maximize"></button>
          <button class="win-btn close" id="win-close" title="Close"></button>
        </div>
      </div>
    </header>
    <div id="body">
      <nav id="sidebar"></nav>
      <main id="main"></main>
    </div>
  </div>
  <aside id="slider" class="slider"></aside>
  <div id="overlay"></div>
  <div id="toasts"></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-search.js"></script>
  <script src="themes.js"></script>
  <script src="os-icons.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/core.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/hosts.js"></script>
  <script src="js/usage.js"></script>
  <script src="js/containers.js"></script>
  <script src="js/databases.js"></script>
  <script src="js/traffic.js"></script>
  <script src="js/servers.js"></script>
  <script src="js/keychain.js"></script>
  <script src="js/forwarding.js"></script>
  <script src="js/snippets.js"></script>
  <script src="js/known.js"></script>
  <script src="js/logs.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/sftp.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
